allowBuilds:
  better-sqlite3: true
  cbor-extract: true
  cpu-features: true
  esbuild: true
  ssh2@https://codeload.github.com/rado0x54/ssh2/tar.gz/dd4f9633bbe66a94824761e41e28fa8723d0dbb9: true
overrides:
  # Security: force patched transitive versions (see pnpm audit).
  # fast-uri stays on 3.x (fastify/@modelcontextprotocol/sdk expect ^3); 3.1.9 patches
  # the path-traversal, SSRF + host-confusion (IDN / literal / backslash) advisories.
  fast-uri: ^3.1.9
  # hono 4.13.11 patches the CORS credentialed-Origin reflection + later advisories (via MCP sdk).
  hono: ^4.13.11
  # undici 7.30.1 patches TLS-validation-bypass + DoS advisories (test-only, via jsdom/vitest).
  undici: ^7.30.1
  # proxy-addr <2.0.8 trusts IPv4-mapped IPv6 spoofing of trust subnets (critical; runtime, via
  # MCP sdk > express).
  proxy-addr: ^2.0.8
  # shell-quote <1.11.0 quadratic-complexity DoS (critical; dev-only, via concurrently).
  shell-quote: ^1.11.0
  # body-parser <2.4.0 (runtime, via MCP sdk > express).
  body-parser: ^2.4.0
  # --- moderate advisories ---
  # @hono/node-server serveStatic path-bypass (runtime, via MCP sdk); stay on 1.x (MCP expects ^1).
  "@hono/node-server": ^1.19.15
  # ip-address XSS in Address6 HTML methods + Address4 leading-zero octets (runtime, via
  # MCP sdk > express-rate-limit).
  ip-address: ^10.7.4
  # qs stringify DoS (runtime, via MCP sdk > express).
  qs: ^6.16.0
  # postcss <\/style> XSS in stringify output (dev, via eslint-plugin-svelte / svelte).
  postcss: ^8.5.23
  # nanoid predictable/invalid-size ids; source-map-js event-loop DoS (dev, via postcss).
  nanoid: ^3.3.18
  source-map-js: ^1.2.2
  # postcss-selector-parser (dev, via eslint-plugin-svelte).
  postcss-selector-parser: ^7.1.6
  # devalue prototype-pollution / DoS advisories (dev, via svelte / @sveltejs/kit).
  devalue: ^5.9.3
  # cookie OOB chars in name/path/domain (low; SvelteKit stays on 0.x).
  cookie: ^0.7.0
  # brace-expansion range-DoS; scope to the vulnerable 4.x/5.0.x window so other majors are untouched.
  "brace-expansion@>=4.0.0 <5.0.12": ^5.0.12
  # esbuild dev-server request advisory; only the deprecated @esbuild-kit chain (drizzle-kit) pulls
  # the vulnerable 0.18.x — scope the bump there so vite/svelte's healthy esbuild copies are untouched.
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
onlyBuiltDependencies:
  - better-sqlite3
  - cbor-extract
  - cpu-features
  - esbuild
  - ssh2
