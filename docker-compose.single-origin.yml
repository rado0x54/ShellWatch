# Opt-in overlay for the single-origin local dev mode (#243): moves Hydra's
# public identity onto the app's origin so OAuth discovery is self-consistent
# for strict (2026-07-28-era) MCP clients — RFC 8414 §3.3 requires the
# authorization-server metadata's issuer to equal the origin it is fetched
# from, which the split :3000/:4444 layout cannot satisfy. ShellWatch itself
# forwards Hydra's public surface when hydra.devProxyUpstream is set in
# config.yaml (see config.sample.yaml and docs/deployment.md "Mirroring the
# single-origin deployment locally").
#
#   docker compose -f docker-compose.yml -f docker-compose.single-origin.yml up -d hydra
#
# Deliberately an overlay, never the default: Ory env vars take precedence
# over the mounted hydra.yml, so putting these in the base file would silently
# override any customized urls.self.* on restart. Without this overlay,
# nothing changes and nothing is forwarded.
#
# The origin is overridable for non-default setups:
#   HYDRA_PUBLIC_ORIGIN=http://localhost:3001 docker compose -f ... up -d hydra

services:
  hydra:
    environment:
      URLS_SELF_ISSUER: ${HYDRA_PUBLIC_ORIGIN:-http://localhost:3000}
      URLS_SELF_PUBLIC: ${HYDRA_PUBLIC_ORIGIN:-http://localhost:3000}
