# SPDX-License-Identifier: LicenseRef-FSL-1.1-Apache-2.0
#
# ShellWatch HTTP wire contract (REST).
#
# This spec is the language-agnostic source of truth for the HTTP surface, hand-
# authored from the Fastify route handlers as of the Node/TypeScript backend. It
# exists to freeze the contract ahead of the Go rewrite (#210, #225): the Go
# server must reproduce these paths, methods, request/response shapes, and status
# codes exactly.
#
# Scope: every REST route (including the anonymous bootstrap surface). Excluded
# on purpose: the /ws + /mcp protocols (documented separately, below), the
# /agent-proxy WS bridge (tracked separately), and the Hydra provider GET pages
# (/api/hydra/{login,consent,logout,error}), which are HTML/redirect flows — the
# hydra-provider tag covers their JSON options/verify endpoints. Sibling protocol
# docs:
#   - WebSocket (/ws)  -> websocket-protocol.md
#   - MCP tools (/mcp) -> mcp-tools.md
#
# Fidelity notes:
#   - Response bodies here mirror what the handlers literally return. Several
#     envelopes are inconsistent across routes (see docs/api/README.md
#     "Known inconsistencies"); this spec documents them AS-IS rather than
#     normalizing, so it can serve as a parity oracle. Do not "fix" shapes here
#     without a matching code change.
#   - WebAuthn ceremony option bodies (registration/authentication options) are
#     the @simplewebauthn/server output shapes; modeled loosely as objects.

openapi: 3.0.3

info:
  title: ShellWatch HTTP API
  version: "1.1.0"
  description: >-
    Passkey-backed SSH brokering for humans and AI agents. All authenticated
    surfaces present a Hydra-issued opaque OAuth bearer token, validated by
    introspection; the token `sub` is the account id. Authorization is by scope
    (`ui` for /api + /ws, `mcp` for /mcp, `agent` for /agent-proxy).
  license:
    name: FSL-1.1-Apache-2.0
    url: https://fsl.software/

servers:
  - url: "{externalUrl}"
    description: Deployment base URL (config.server.externalUrl)
    variables:
      externalUrl:
        default: http://localhost:3000

tags:
  - name: meta
    description: Unauthenticated health / build / bootstrap
  - name: discovery
    description: OAuth discovery + mediated DCR (RFC 8414 / 9728 / 7591)
  - name: hydra-provider
    description: Passkey-gated Hydra login & consent providers (HTML + JSON)
  - name: account
    description: Current account + admin account management
  - name: auth-sessions
    description: Authorized OAuth clients (Hydra consent sessions)
  - name: endpoints
    description: SSH endpoint CRUD
  - name: sessions
    description: Terminal session lifecycle
  - name: actions
    description: Human-in-the-loop signing approvals
  - name: audit
    description: Session-lifecycle + signing-request audit log + notification log + file-transfer log
  - name: transfers
    description: Out-of-band file transfer links minted by the MCP file tools (#263)
  - name: tickets
    description: One-time access tickets — single-endpoint guest sessions admitted from a trusted device (#306)
  - name: keys
    description: File-based SSH key listing (admin)
  - name: push
    description: Web Push subscription management
  - name: webauthn
    description: Passkey registration, credentials, step-up
  - name: passkey-invite
    description: Anonymous invite-based passkey enrollment

security:
  - bearerUi: []

components:
  securitySchemes:
    bearerUi:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Hydra opaque access token with the `ui` scope. Required for all `/api/*`
        routes except those listed as `security: []`. For `/ws` the same token
        is passed via `Sec-WebSocket-Protocol: shellwatch.bearer, <token>`
        because browsers cannot set an Authorization header on a WS handshake.
    bearerMcp:
      type: http
      scheme: bearer
      description: Opaque token with `mcp` scope (guards /mcp; IP-allowlisted).
    bearerAgent:
      type: http
      scheme: bearer
      description: Opaque token with `agent` scope (guards /agent-proxy, when enabled).

  responses:
    Unauthorized:
      description: Missing or invalid bearer token (WWW-Authenticate set).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Token lacks required scope, or admin-only route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found (or hidden cross-account).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StepUpRequired:
      description: >-
        Step-up authentication missing, or the supplied token is expired / not
        valid for this action or account. Emitted by the `requireStepUp`
        preHandler (src/webauthn/stepup-gate.ts) before the route body runs.
        NOTE: unlike the general `{ error }` envelope, this body carries a
        machine-readable `code` (see README inconsistency F).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StepUpError" }

  parameters:
    StepUpTokenHeader:
      name: X-ShellWatch-StepUp-Token
      in: header
      required: true
      description: >-
        Single-use step-up token minted by POST /api/webauthn/stepup/verify,
        bound to the specific action. Sent on the header
        `x-shellwatch-stepup-token`. Absent/expired/wrong-action/wrong-account → 401.
      schema: { type: string }

  schemas:
    StepUpError:
      type: object
      description: Error body returned by the step-up gate (401).
      required: [error, code]
      properties:
        error: { type: string }
        code:
          type: string
          enum: [stepup_required, stepup_expired, stepup_wrong_action, stepup_wrong_account]

    Error:
      type: object
      description: Standard error envelope. Almost every 4xx/5xx returns this.
      required: [error]
      properties:
        error: { type: string }
        notificationId:
          type: string
          description: >-
            Present when the failure was also published to the account's
            notification log (#252), e.g. a session create refused by a
            host-key mismatch or by an endpoint accepting SSH "none"
            authentication (#311). Clients deduplicate their error display against
            the notification:new WebSocket message by this id instead of
            matching error text.
      additionalProperties: true

    PasskeyList:
      type: object
      properties:
        credentials:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              credentialId: { type: string }
              label: { type: string }
              algorithm: { type: string }
              fingerprint: { type: string }
              authorizedKeysEntry: { type: string, nullable: true }
              revoked: { type: boolean }
              state: { type: string }
              createdAt: { type: string, format: date-time }
              lastUsedAt: { type: string, format: date-time, nullable: true }
              priority:
                type: integer
                nullable: true
                description: >-
                  Position in the SSH signing order (lower = tried first).
                  Null for pending and revoked credentials. Gaps are
                  possible; only the relative order matters.
        sshdConfig: { type: string }

    StatusCreated:
      type: object
      properties:
        status: { type: string, enum: [created] }
        id: { type: string }
      required: [status, id]
    StatusUpdated:
      type: object
      properties: { status: { type: string, enum: [updated] } }
      required: [status]
    StatusDeleted:
      type: object
      properties: { status: { type: string, enum: [deleted] } }
      required: [status]

    TerminalStatus:
      type: string
      enum: [opening, open, closing, closed, error]
    TerminalSource:
      type: string
      enum: [ui, mcp, ssh, ticket]
      description: >-
        `ticket` is a guest session admitted through a one-time access ticket
        (#306).

    TerminalSession:
      type: object
      description: >-
        Returned verbatim by POST /api/sessions and inside GET /api/sessions.
        Mirrors src/terminal/types.ts TerminalSession (Date fields serialize to
        ISO-8601 strings over the wire).
      properties:
        sessionId: { type: string, example: "sess_a1b2c3d4e5f6" }
        endpointId: { type: string }
        accountId: { type: string }
        status: { $ref: "#/components/schemas/TerminalStatus" }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        source: { $ref: "#/components/schemas/TerminalSource" }
        closeReason: { type: string, nullable: true }
        sourceIp: { type: string }
        ownerClientId:
          type: string
          description: >-
            OAuth client_id that owns the session (mcp source only; omitted for
            ui sessions). MCP session visibility is scoped to
            (account, ownerClientId) — #243.
        reason:
          type: string
          description: >-
            The trigger's self-reported reason (unverified): an MCP agent's
            (source `mcp`) or a one-time access guest's (source `ticket`,
            #306); `source` tells which (#319).
        mcpClientName: { type: string }
        mcpClientVersion: { type: string }
        ticketId:
          type: string
          description: Source `ticket` only (#306) — the ticket that admitted the guest.
        ticketLabel:
          type: string
          description: Source `ticket` only (#306); may be empty.
        guestAttached:
          type: boolean
          description: >-
            Source `ticket` only (#306) — whether the guest's browser currently
            holds a guest WebSocket. Omitted once the guest session is over.
      # lastActivityAt is always emitted: types.ts TerminalSession declares it
      # non-optional and the manager sets it at create time.
      required: [sessionId, endpointId, accountId, status, createdAt, lastActivityAt, source]

    EndpointHostKey:
      type: object
      nullable: true
      description: >-
        The endpoint's pinned SSH host key (#241). Pinned by the first approved
        connection (combined approval dialog), a manual pin, config-file
        provisioning, or the baked-in demo pin.
      properties:
        type:
          type: string
          description: SSH key type (e.g. ssh-ed25519); empty for fingerprint-only pins.
        fingerprint: { type: string, description: "SHA256:... fingerprint" }
        pinnedAt: { type: string, description: ISO-8601; empty for demo pins }
        pinnedBy:
          type: string
          description: >-
            Credential id of the approving passkey, "file-key:<label>" for a
            key-approve pin, or "manual" / "config" / "demo".
      required: [type, fingerprint, pinnedAt, pinnedBy]

    Endpoint:
      type: object
      description: Endpoint as listed by GET /api/endpoints.
      properties:
        id: { type: string }
        label: { type: string }
        host: { type: string }
        port: { type: integer, default: 22 }
        username: { type: string, default: shellwatch }
        userVerification:
          type: string
          enum: [required, preferred, discouraged]
        agentForward: { type: boolean }
        description: { type: string, nullable: true }
        isDemo: { type: boolean }
        hostKey: { $ref: "#/components/schemas/EndpointHostKey" }
      # userVerification/agentForward/description are always emitted: DB columns
      # are NOT NULL with defaults (user_verification='required', agent_forward=true),
      # and the demo-endpoint synthesizer sets all three (description may be null).
      # hostKey is always emitted; null when no host key is pinned (#241).
      required:
        [
          id,
          label,
          host,
          port,
          username,
          userVerification,
          agentForward,
          description,
          isDemo,
          hostKey,
        ]

    AuthSessionView:
      type: object
      properties:
        clientId: { type: string }
        clientName: { type: string }
        scopes: { type: array, items: { type: string } }
        authorizedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        current:
          type: boolean
          description: True for the first-party web-UI client.
      # All keys are always emitted (auth-sessions.ts AuthSessionView declares
      # every field non-optional; the two dates are explicit nulls when absent).
      required: [clientId, clientName, scopes, authorizedAt, createdAt, current]

    PendingActionView:
      type: object
      description: >-
        Client-safe projection of a pending signing action (resolve/reject
        omitted). Discriminated on `type`.
      properties:
        id: { type: string }
        accountId: { type: string }
        type: { type: string, enum: [webauthn-sign, key-approve] }
        status: { type: string, enum: [pending, completed, expired, denied] }
        createdAt: { type: integer, description: epoch ms }
        expiresAt: { type: integer, description: epoch ms }
        context: { type: object, description: "SignRequestContext (source-tagged union)" }
        redirectTo: { type: string }
        connectionId: { type: string }
        # webauthn-sign only:
        credentialId: { type: string }
        challenge: { type: string }
        rpId: { type: string }
        passkeyLabel: { type: string }
        userVerification: { type: string, enum: [required, preferred, discouraged] }
        # key-approve only:
        keyLabel: { type: string }
        keyFingerprint: { type: string }
      required: [id, accountId, type, status, createdAt, expiresAt, context]

    SessionLifecyclePage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/SessionLifecycleRow" }
        nextCursor:
          type: string
          nullable: true
          description: Opaque cursor; null on the final page.
      required: [rows, nextCursor]

    SessionLifecycleRow:
      type: object
      properties:
        sessionId: { type: string }
        accountId: { type: string }
        endpointId: { type: string }
        # Enforced by DB CHECK constraints (migration 00008 adds ticket):
        source: { type: string, enum: [ui, mcp, ssh, ticket] }
        status: { type: string, enum: [open, closed, error] }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        durationMs: { type: integer, nullable: true }
        sourceIp: { type: string, nullable: true }
        reason:
          type: string
          nullable: true
          description: >-
            The trigger's self-reported reason (unverified): an MCP agent's
            (source `mcp`) or a one-time access guest's (source `ticket`,
            #306); `source` tells which (#319).
        mcpClientName: { type: string, nullable: true }
        mcpClientVersion: { type: string, nullable: true }
        clientHostname: { type: string, nullable: true }
        clientOs: { type: string, nullable: true }
        clientVersion: { type: string, nullable: true }
        closeReason: { type: string, nullable: true }
        ticketId:
          type: string
          nullable: true
          description: Source `ticket` only (#306).
        ticketLabel: { type: string, nullable: true }

    SigningRequestPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/SigningRequestRow" }
        nextCursor: { type: string, nullable: true }
      required: [rows, nextCursor]

    OAuthClientRegistrationPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/OAuthClientRegistration" }
        nextCursor: { type: string, nullable: true }
      required: [rows, nextCursor]

    OAuthClientRegistration:
      type: object
      description: >-
        One entry of the OAuth client registration log (#242): how an MCP or
        agent client came to exist in Hydra, via mediated DCR
        (POST /api/hydra/register) or CIMD document resolution
        (GET /api/hydra/authorize).


        This is the only audit surface that is **not account-scoped**. Both
        onboarding paths run before any account is identified — there is no
        subject, no bearer token, only a peer address and a `client_id` — so
        reads are gated on the admin role instead of an account filter.


        It is a **log, not a registry**: current client state stays in Hydra
        (`GET /admin/clients` serves name, scope, redirect URIs, `created_at`
        and the `metadata.shellwatch.origin` marker ShellWatch writes). Rows
        here are a snapshot denormalized at write time and are never
        reconciled, so a client deleted in Hydra keeps its history.
      properties:
        id: { type: string }
        clientId:
          type: string
          description: >-
            Hydra's `client_id` — a UUID for DCR, the Client Identifier URL for
            CIMD. The link to Hydra's own data model. Not unique in this table:
            a client appears once per event.
        origin:
          type: string
          enum: [dcr, cimd]
          description: Which onboarding path produced the event.
        event:
          type: string
          description: >-
            `registered` — the client was created in Hydra; `refreshed` — a
            CIMD document changed and the Hydra client was updated;
            `rejected` — the registration was refused, so **no Hydra client
            exists** for this row. Not enum-constrained: #255 adds `blocked`.
          example: registered
        clientName: { type: string, nullable: true }
        metadataHost:
          type: string
          nullable: true
          description: >-
            The CIMD Client Identifier URL's hostname — the identity cue
            draft-ietf-oauth-client-id-metadata-document-02 §9.1 wants
            surfaced. Null for DCR, which has no metadata document.
        authMethod: { type: string, nullable: true, example: none }
        redirectUris:
          type: array
          items: { type: string }
          description: Empty on a rejection, where no document was accepted.
        scope: { type: string, nullable: true }
        reason:
          type: string
          nullable: true
          description: >-
            The cause for `rejected`, or what changed for `refreshed`.
        sourceIp:
          type: string
          nullable: true
          description: Peer address resolved under the server's trustProxy policy.
        createdAt: { type: string }
      required: [id, clientId, origin, event, createdAt]

    TicketView:
      type: object
      description: >-
        The owner's view of a one-time access ticket and, once redeemed, its
        guest session (#306). Tickets live in process memory: a restart
        invalidates them. Listed while the ticket is unredeemed or its guest
        session is live, then for 5 minutes as `closed` (at most 10 per
        account); afterwards only the audit log has it.
      properties:
        id: { type: string }
        endpointId: { type: string }
        label: { type: string, description: May be empty. }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: End of the redeem TTL.
        redeemTtlSeconds: { type: integer, minimum: 60, maximum: 86400 }
        lifetimeSeconds:
          type: integer
          minimum: 60
          maximum: 28800
          description: Hard cap on the guest session, counted from admission.
        reasonRequired: { type: boolean }
        agentForward:
          type: boolean
          description: >-
            When true the endpoint's own agentForward setting is honoured; when
            false no forwarding channel is opened whatever the endpoint says.
        state:
          type: string
          enum: [minted, redeemed, pending, refused, open, closed]
          description: >-
            `minted` — not redeemed yet; `redeemed` — redeemed, guest WebSocket
            not attached yet; `pending` — an admission attempt is running (sign
            prompts are open); `refused` — the last attempt was not approved,
            the guest may ask again inside the admission window; `open` —
            admitted; `closed` — the guest session ended (`endReason`). A
            closed ticket stays listed for 5 minutes, at most 10 per account.
        guest: { $ref: "#/components/schemas/TicketGuestView" }
        endedAt:
          type: string
          format: date-time
          nullable: true
          description: When the guest session closed (state `closed` only).
        endReason:
          type: string
          nullable: true
          description: >-
            Why the guest session closed (a terminal close reason, e.g.
            `client.guest`, `ticket-revoked`, `ticket-lifetime`); state
            `closed` only.
      required:
        [
          id,
          endpointId,
          label,
          createdAt,
          expiresAt,
          redeemTtlSeconds,
          lifetimeSeconds,
          reasonRequired,
          agentForward,
          state,
          guest,
          endedAt,
          endReason,
        ]

    TicketGuestView:
      type: object
      nullable: true
      description: Null until the ticket is redeemed.
      properties:
        state: { type: string, enum: [redeemed, pending, refused, open, closed] }
        channel: { type: string, enum: [web], description: "`ssh` follows with #307." }
        confirmationCode:
          type: string
          description: >-
            4 characters, shown on the guest's waiting screen and on the
            approval prompt.
        reason: { type: string, description: Self-reported by the guest. }
        sourceIp: { type: string }
        userAgent: { type: string, description: Self-reported by the guest browser. }
        redeemedAt: { type: string, format: date-time }
        admissionDeadline:
          type: string
          format: date-time
          nullable: true
          description: Set on the first guest attach (admission window).
        lifetimeDeadline:
          type: string
          format: date-time
          nullable: true
          description: Set on admission.
        sessionId:
          type: string
          nullable: true
          description: The admitted terminal session, or the running attempt's.
        attempt: { type: integer, description: Number of admission attempts so far. }
        attached: { type: boolean, description: At least one guest connection is open. }
        connections: { type: integer }
      required:
        [
          state,
          channel,
          confirmationCode,
          reason,
          sourceIp,
          userAgent,
          redeemedAt,
          admissionDeadline,
          lifetimeDeadline,
          sessionId,
          attempt,
          attached,
          connections,
        ]

    TicketEventPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/TicketEventRow" }
        nextCursor: { type: string, nullable: true }
      required: [rows, nextCursor]

    TicketEventRow:
      type: object
      description: >-
        One event of a ticket's life (#306). The ticket's options are
        snapshotted on every row. The ticket token and the guest cookie are
        never recorded.
      properties:
        id: { type: string }
        accountId: { type: string }
        ticketId: { type: string }
        event:
          type: string
          description: >-
            minted | redeemed | attached | attempt-failed | retried | admitted |
            detached | reattached | ended | revoked | expired | invalidated.
            Not enum-constrained.
          example: minted
        createdAt: { type: string, format: date-time }
        endpointId: { type: string }
        ticketLabel: { type: string, nullable: true }
        channel: { type: string, nullable: true, description: "`web` once redeemed." }
        redeemTtlSeconds: { type: integer }
        lifetimeSeconds: { type: integer }
        reasonRequired: { type: boolean }
        agentForward: { type: boolean }
        reason: { type: string, nullable: true, description: Self-reported by the guest. }
        sourceIp: { type: string, nullable: true }
        userAgent: { type: string, nullable: true, description: Self-reported. }
        confirmationCode: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        attempt: { type: integer, nullable: true }
        endReason:
          type: string
          nullable: true
          description: >-
            `ended`: the end reason (client.guest, guest-disconnected,
            ticket-lifetime, ticket-not-admitted, ticket-unattached,
            ticket-revoked, endpoint-removed, account-deleted, shutdown, or a
            terminal close reason such as client.ui / idle-timeout /
            server-hangup). `attempt-failed` / `invalidated`: why.
        durationMs:
          type: integer
          nullable: true
          description: "`ended` after admission: admission to end."
      required:
        [
          id,
          accountId,
          ticketId,
          event,
          createdAt,
          endpointId,
          ticketLabel,
          channel,
          redeemTtlSeconds,
          lifetimeSeconds,
          reasonRequired,
          agentForward,
          reason,
          sourceIp,
          userAgent,
          confirmationCode,
          sessionId,
          attempt,
          endReason,
          durationMs,
        ]

    FileTransferPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/FileTransferRow" }
        nextCursor: { type: string, nullable: true }
      required: [rows, nextCursor]

    FileTransferRow:
      type: object
      description: >-
        One file operation an MCP agent performed through a session (#263).
        Inline operations (tier `inline`) are written once, already finished.
        A link transfer's row (tier `link`) is saved ahead of each state
        transition, so it is also the durable record after a crash. The same
        fields are pushed live as the terminal:file WebSocket message (see
        docs/api/websocket-protocol.md). The transfer token is never stored.
      properties:
        transferId: { type: string }
        accountId: { type: string }
        sessionId: { type: string }
        endpointId: { type: string }
        tier:
          type: string
          enum: [inline, link]
          description: "`inline`: one tool call. `link`: out-of-band HTTP transfer."
        direction:
          type: string
          enum: [upload, download, list]
          description: >-
            `upload` writes to the remote host, `download` reads from it;
            `list` is a directory listing (inline only).
        path:
          type: string
          description: Absolute remote path.
        status:
          type: string
          enum: [pending, active, committing, completed, failed, cancelled, expired]
          description: >-
            `committing` (link uploads: the commit call has been issued) is
            visible here only; the MCP tool and the WebSocket frame report it
            as `active`.
        bytes:
          type: integer
          format: int64
          description: Bytes moved.
        totalBytes:
          type: integer
          format: int64
          nullable: true
          description: Expected size, when known.
        sha256:
          type: string
          nullable: true
          description: Hex digest of the bytes written / sent.
        error: { type: string, nullable: true }
        truncated:
          type: boolean
          nullable: true
          description: >-
            Link downloads: `true` when the file was observed to grow after the
            copy (a post-copy extra-byte probe). Observed growth only —
            concurrent mutation cannot be detected in general.
        commitOutcome:
          type: string
          nullable: true
          enum: [ok, failed, unknown, null]
          description: >-
            Link uploads. `unknown`: the connection was lost (or the server
            restarted) after the commit was sent and before its reply arrived —
            inspect the destination before retrying.
        cleanup:
          type: string
          nullable: true
          enum: [ok, failed, null]
          description: Link uploads — outcome of the best-effort staging cleanup.
        stagingPath:
          type: string
          nullable: true
          description: >-
            The staging directory while it exists; with cleanup `failed`, the
            leftover a human should remove.
        clientId:
          type: string
          nullable: true
          description: The authenticated OAuth `client_id` that issued the operation.
        mcpClientName:
          type: string
          nullable: true
          description: Client-reported MCP client name.
        mcpClientVersion: { type: string, nullable: true }
        sourceIp: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
      required:
        - transferId
        - accountId
        - sessionId
        - endpointId
        - tier
        - direction
        - path
        - status
        - bytes
        - totalBytes
        - sha256
        - error
        - truncated
        - commitOutcome
        - cleanup
        - stagingPath
        - clientId
        - mcpClientName
        - mcpClientVersion
        - sourceIp
        - createdAt
        - updatedAt
        - finishedAt

    TransferResult:
      type: object
      description: >-
        Outcome body of a transfer link request (upload always; download only
        when it failed before the response body started). Same shape as the
        shellwatch_transfer_file `status` result.
      properties:
        transferId: { type: string }
        status:
          type: string
          enum: [pending, active, completed, failed, cancelled, expired]
        direction: { type: string, enum: [upload, download] }
        path: { type: string }
        bytes: { type: integer, format: int64 }
        totalBytes: { type: integer, format: int64 }
        sha256: { type: string }
        error: { type: string }
        truncated: { type: boolean }
        commitOutcome: { type: string, enum: [ok, failed, unknown] }
        cleanup: { type: string, enum: [ok, failed] }
        stagingPath: { type: string }
      required: [transferId, status, direction, path, bytes]

    NotificationPage:
      type: object
      properties:
        rows:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string, nullable: true }
      required: [rows, nextCursor]

    Notification:
      type: object
      description: >-
        One entry of the account notification log (#252): a server-originated
        event the user must not miss. Also pushed live as the notification:new
        WebSocket message (see docs/api/websocket-protocol.md). Client behavior
        (toast severity, action links) derives from type + payload, never from
        title/detail text.
      properties:
        id: { type: string }
        accountId: { type: string }
        type:
          type: string
          description: >-
            Notification kind; payload shape is typed per kind. Known kinds:
            host-key-mismatch — a dial was refused before authentication
            because the server presented a key that differs from the pin
            (payload: endpointId, endpointLabel, endpointAddress, keyType,
            observedFingerprint, pinnedFingerprint, auditId of the
            host-key-mismatch audit row); unauthenticated-endpoint (#311,
            severity error) — a connection was refused because the server
            accepted SSH "none" authentication, so no key was asked for and
            no human approved it; there is no action to resolve (payload:
            endpointId, endpointLabel, endpointAddress, remoteUser, trigger,
            mcpClientName, sourceIp, auditId of the unauthenticated-endpoint
            audit row); session-connect-failed — any other
            failed SSH connect, whatever the trigger (payload: endpointId,
            endpointLabel, endpointAddress, trigger, mcpClientName,
            mcpClientVersion, reason, sourceIp, error);
            file-transfer-failed — an out-of-band file transfer ended failed
            or expired, including one interrupted by a server restart, or a
            finished upload (status may be completed or cancelled) whose staging cleanup
            a restart cut short (payload: transferId, sessionId, endpointId, direction, path,
            status, error, bytes, commitOutcome, cleanup, stagingPath,
            mcpClientName). Clients must ignore
            unknown kinds gracefully (render title/detail, no typed action).
        severity: { type: string, enum: [info, warning, error] }
        title:
          type: string
          description: Short headline sized for a toast.
        detail:
          type: string
          nullable: true
          description: Long-form preformatted text behind a Details view.
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Type-specific structured data (see `type`).
        createdAt: { type: string, format: date-time }
      required: [id, accountId, type, severity, title, detail, payload, createdAt]

    SigningRequestRow:
      type: object
      properties:
        id: { type: string }
        accountId: { type: string }
        type:
          type: string
          description: >-
            webauthn-sign | key-approve, plus the host-key event types (#241):
            host-key-mismatch (a connection aborted before authentication
            because the presented key differed from the pin; outcome is
            "denied") and host-key-cleared (a pin removed — host/port change
            or a human forgetting the key; outcome stays null); and
            unauthenticated-endpoint (#311: a connection refused because the
            server accepted SSH "none" authentication; source endpoint-auth,
            outcome "denied", hostKeyFingerprint is the observed key; no
            pending action ever existed).
        source:
          type: string
          enum: [endpoint-auth, agent-forwarding, agent-proxy, endpoint-admin]
          description: endpoint-admin is used by host-key-cleared rows (#241).
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time, nullable: true }
        outcome:
          type: string
          nullable: true
          enum: [approved, denied, expired, cancelled, null]
        latencyMs: { type: integer, nullable: true }
        sourceIp: { type: string, nullable: true }
        endpointLabel: { type: string, nullable: true }
        endpointAddress: { type: string, nullable: true }
        sessionId: { type: string, nullable: true }
        reason:
          type: string
          nullable: true
          description: >-
            The trigger's self-reported reason (unverified, #319): an MCP
            agent's (mcpClientName is set) or a one-time access guest's
            (#306).
        mcpClientName: { type: string, nullable: true }
        mcpClientVersion: { type: string, nullable: true }
        clientHostname: { type: string, nullable: true }
        clientOs: { type: string, nullable: true }
        clientVersion: { type: string, nullable: true }
        credentialId: { type: string, nullable: true }
        passkeyLabel: { type: string, nullable: true }
        userVerification: { type: string, nullable: true }
        keyLabel: { type: string, nullable: true }
        keyFingerprint: { type: string, nullable: true }
        cancelReason: { type: string, nullable: true }
        # Host-key pinning (#241):
        endpointId:
          type: string
          nullable: true
          description: Set on host-key event rows (mismatch / cleared).
        hostKeyFingerprint:
          type: string
          nullable: true
          description: >-
            The observed host key for sign rows and mismatch rows; the cleared
            pin for host-key-cleared rows.
        hostKeyPriorFingerprint:
          type: string
          nullable: true
          description: The pinned fingerprint a mismatch was checked against.
        hostKeyPinned:
          type: boolean
          nullable: true
          description: True when this approval pinned the endpoint's host key.

    ProtectedResourceMetadata:
      type: object
      description: >-
        RFC 9728 protected-resource metadata. Emitted by `resourceMetadata(scope)`
        in src/hydra/routes.ts for the `/mcp` and `/agent-proxy` resources.
      properties:
        resource:
          type: string
          description: Absolute URL of the guarded resource (externalUrl + /mcp or /agent-proxy).
        authorization_servers:
          type: array
          items: { type: string }
          description: Points back at this deployment's AS metadata origin (externalUrl).
        bearer_methods_supported:
          type: array
          items: { type: string }
          example: [header]
        scopes_supported:
          type: array
          items: { type: string }
          description: The resource scope (mcp|agent) plus offline_access.
      required: [resource, authorization_servers, bearer_methods_supported, scopes_supported]

    AgentClientMetadataDocument:
      type: object
      description: >-
        OAuth Client ID Metadata Document (draft-ietf-oauth-client-id-metadata-document)
        for `shellwatch-agent` (#256). Static: the same bytes on every instance,
        embedded from `internal/hydra/agent-client-metadata.json`. `client_id` is
        always the app.shellwatch.ai URL, which is the agent's fixed client_id.
      properties:
        client_id:
          type: string
          example: https://app.shellwatch.ai/.well-known/shellwatch-agent-client.json
        client_name: { type: string, example: ShellWatch Agent }
        client_uri: { type: string }
        software_id: { type: string, example: shellwatch-agent }
        application_type: { type: string, example: native }
        redirect_uris:
          type: array
          items: { type: string }
          description: >-
            Port-less loopback IP literals only (never `localhost`, #281); the
            RFC 8252 §7.3 exception covers the agent's ephemeral port.
          example: ["http://127.0.0.1/callback", "http://[::1]/callback"]
        grant_types:
          type: array
          items: { type: string }
        response_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string, example: none }
        scope: { type: string, example: agent }
      required:
        [
          client_id,
          client_name,
          redirect_uris,
          grant_types,
          response_types,
          token_endpoint_auth_method,
          scope,
        ]

    AuthorizationServerMetadata:
      type: object
      description: >-
        RFC 8414 authorization-server metadata, blended: issuer + token/jwks/
        revocation point at Hydra; `registration_endpoint` points at ShellWatch's
        mediated DCR (/api/hydra/register) and, when CIMD is enabled (the
        default), `authorization_endpoint` points at ShellWatch's CIMD front
        door (/api/hydra/authorize) rather than Hydra's /oauth2/auth.
      properties:
        issuer: { type: string }
        authorization_endpoint: { type: string }
        token_endpoint: { type: string }
        registration_endpoint: { type: string }
        jwks_uri: { type: string }
        revocation_endpoint: { type: string }
        response_types_supported: { type: array, items: { type: string }, example: [code] }
        grant_types_supported:
          type: array
          items: { type: string }
          example: [authorization_code, refresh_token]
        code_challenge_methods_supported: { type: array, items: { type: string }, example: [S256] }
        token_endpoint_auth_methods_supported:
          type: array
          description: >-
            ShellWatch never issues a client secret — not via DCR, and CIMD
            forbids it outright (draft-ietf-oauth-client-id-metadata-document-02
            §4.1) — so the shared-secret methods Hydra would accept are not
            advertised.
          items: { type: string }
          example: [none, private_key_jwt]
        scopes_supported: { type: array, items: { type: string } }
        client_id_metadata_document_supported:
          type: boolean
          description: >-
            draft-ietf-oauth-client-id-metadata-document-02 §6. `true` when
            ShellWatch resolves an https URL `client_id` as a Client ID Metadata
            Document. Omitted entirely when CIMD is disabled, in which case
            `authorization_endpoint` is Hydra's own `/oauth2/auth` and a URL
            `client_id` is rejected as an unknown client.
          example: true
      required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint]

    WebAuthnRegistrationOptions:
      type: object
      description: >-
        @simplewebauthn generateRegistrationOptions() output, spread at the top
        level alongside `challengeId`. Modeled loosely.
      additionalProperties: true
      properties:
        challengeId: { type: string }
    WebAuthnAuthenticationOptions:
      type: object
      description: >-
        @simplewebauthn generateAuthenticationOptions() output, spread at the top
        level alongside `challengeId` (and `action` for step-up). Modeled loosely.
      additionalProperties: true
      properties:
        challengeId: { type: string }

paths:
  # ---------------------------------------------------------------- meta
  /health:
    get:
      operationId: getHealth
      tags: [meta]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [ok] } }

  /api/version:
    get:
      operationId: getVersion
      tags: [meta]
      security: []
      summary: Build info (curl-able without auth)
      description: >-
        The BuildInfo object (src/server/buildInfo.ts) — also injected into the
        SPA as `window.__BUILD_INFO__` via /config.js.
      responses:
        "200":
          description: BuildInfo
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha: { type: string, description: 'Full git SHA, or "dev" for local builds' }
                  ref: { type: string, description: 'Branch/ref name, or "local"' }
                  tag: { type: string, nullable: true, description: "Release tag, or null" }
                  builtAt:
                    {
                      type: string,
                      format: date-time,
                      nullable: true,
                      description: "Build timestamp, or null",
                    }
                  display: { type: string, description: "Human-readable: tag, else ref@shortSha" }
                required: [sha, ref, tag, builtAt, display]

  /config.js:
    get:
      operationId: getConfigScript
      tags: [meta]
      security: []
      summary: Browser bootstrap config (JS, not JSON)
      description: >-
        Emits `window.__SELF_REGISTRATION_ENABLED__`, `__VAPID_PUBLIC_KEY__`,
        `__BUILD_INFO__`, and `__OAUTH__` (issuer, clientId, redirectUri, scope)
        as executable JavaScript assignments.
      responses:
        "200":
          description: JavaScript
          content:
            application/javascript:
              schema: { type: string }

  # ------------------------------------------- anonymous self-registration
  # Bootstrap onboarding (src/webauthn/self-register.ts). Unauthenticated
  # (pre-token); listed in the bearer-gate EXEMPT set. First run (no passkeys
  # yet) bootstraps the admin; afterward gated by security.selfRegistrationEnabled.
  /api/auth/passkey-status:
    get:
      operationId: getPasskeyStatus
      tags: [meta]
      security: []
      summary: Whether any passkeys exist yet (first-run detection)
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties: { hasPasskeys: { type: boolean } }
                required: [hasPasskeys]
  /api/auth/register/options:
    post:
      operationId: startAccountRegistration
      tags: [meta]
      security: []
      summary: Registration options for anonymous self-registration (rate-limited)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string } }
      responses:
        "200":
          description: Registration options + challengeId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnRegistrationOptions" }
        "403":
          description: Self-registration disabled (and passkeys already exist)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/register:
    post:
      operationId: finishAccountRegistration
      tags: [meta]
      security: []
      summary: Verify passkey + create the account (anonymous, rate-limited)
      description: >-
        On first run (no passkeys) bootstraps the admin account; otherwise creates
        a self-registered account when enabled. Issues no token/session — the SPA
        starts the Hydra login flow afterward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                challengeId: { type: string }
                credential: {}
              required: [name, challengeId, credential]
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, enum: [true] }
                  accountId: { type: string }
                  id: { type: string, description: "credential row id" }
                  credentialId: { type: string }
                  label: { type: string }
                required: [verified, accountId, id, credentialId, label]
        "400":
          description: Missing fields or verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Self-registration disabled (and passkeys already exist)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------ discovery
  /.well-known/oauth-authorization-server:
    get:
      operationId: getAuthorizationServerMetadata
      tags: [discovery]
      security: []
      summary: Blended AS metadata (RFC 8414)
      description: >-
        The token endpoint points at Hydra (the real issuer); the
        `registration_endpoint` points at ShellWatch's mediated DCR (Hydra's own
        public registration endpoint is switched off), and
        `authorization_endpoint` at ShellWatch's CIMD front door
        (`/api/hydra/authorize`) whenever `client_id_metadata_document_supported`
        is `true`. With CIMD disabled, `authorization_endpoint` is Hydra's
        `/oauth2/auth` and the CIMD flag is absent. `scopes_supported`
        includes the bearer scopes (`mcp`, plus `agent` when the proxy is enabled)
        and `offline_access`.
      responses:
        "200":
          description: AS metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizationServerMetadata" }

  /.well-known/oauth-protected-resource:
    get:
      operationId: getProtectedResourceMetadata
      tags: [discovery]
      security: []
      summary: Protected-resource metadata — bare/default location (RFC 9728)
      description: >-
        Convenience alias that returns the **same** MCP resource metadata as
        `/.well-known/oauth-protected-resource/mcp`. Many MCP clients probe this
        default path first. See README inconsistency (I).
      responses:
        "200":
          description: Resource metadata (MCP)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }

  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getProtectedResourceMetadataMcp
      tags: [discovery]
      security: []
      summary: Protected-resource metadata for /mcp (RFC 9728)
      description: >-
        This is the MCP auth-discovery document. On a 401 from `/mcp`, the
        `WWW-Authenticate` header's `resource_metadata` param points here so an
        OAuth-aware MCP client can find the Hydra issuer, then DCR, then
        authorization_code + PKCE.
      responses:
        "200":
          description: Resource metadata (MCP)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }

  /.well-known/oauth-protected-resource/agent-proxy:
    get:
      operationId: getProtectedResourceMetadataAgentProxy
      tags: [discovery]
      security: []
      summary: Protected-resource metadata for /agent-proxy (only when agent proxy enabled)
      responses:
        "200":
          description: Resource metadata (agent)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtectedResourceMetadata" }
        "404":
          description: >-
            Agent proxy disabled — route not mounted. Like every unknown
            `/api/*` and `/.well-known/*` path, answered with the JSON
            `{"error":"Not found"}` body, never the SPA's index.html.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /.well-known/shellwatch-agent-client.json:
    get:
      operationId: getAgentClientMetadataDocument
      tags: [discovery]
      security: []
      summary: shellwatch-agent Client ID Metadata Document (only when agent proxy enabled)
      description: >-
        The agent's CIMD document (#256). Every instance serves it, but the
        agent's `client_id` is always
        `https://app.shellwatch.ai/.well-known/shellwatch-agent-client.json`, so
        only app.shellwatch.ai's copy is ever resolved; a self-hosted
        authorization server fetches it from there. Served with
        `Cache-Control: public, max-age=86400`.
      responses:
        "200":
          description: Client metadata document
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=86400" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentClientMetadataDocument" }
        "404":
          description: >-
            Agent proxy disabled — route not mounted. Like every unknown
            `/api/*` and `/.well-known/*` path, answered with the JSON
            `{"error":"Not found"}` body, never the SPA's index.html.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/hydra/authorize:
    get:
      operationId: authorizeOauthClient
      tags: [discovery]
      security: []
      summary: Authorization front door — resolves a CIMD client_id, then hands off to Hydra
      description: >-
        Advertised as `authorization_endpoint` in the AS metadata when CIMD is
        enabled. ShellWatch mediates client onboarding by design: Hydra's own
        public registration endpoint is switched off and `/api/hydra/register`
        mediates DCR, so that local policy — redirect-URI patterns, the scope
        allowlist, never issuing a secret, the registration log — is enforced
        before anything reaches Hydra. This endpoint is the same arrangement
        for CIMD, and it is also a practical necessity: Hydra rejects an https
        URL `client_id` as an unknown client before ShellWatch would ever see
        the request.


        This endpoint issues no code and touches no session. For a `client_id`
        that is **not** an `https://` URL — the first-party SPA, every DCR
        client — it redirects straight to Hydra's `/oauth2/auth` with the query
        string forwarded verbatim. For a URL `client_id` it first resolves the
        Client ID Metadata Document (fetch, validate, provision a Hydra client
        whose `client_id` **is** the URL), then redirects the same way.


        Query parameters are those of an OAuth 2.0 authorization request
        (RFC 6749 §4.1.1 plus PKCE); they are passed through unchanged rather
        than re-serialized, and are documented here only as far as CIMD reads
        them.


        Resolution runs on every authorization, not only the first. The document
        cache (see `hydra.cimd.cacheMinSeconds`) decides whether the document is
        re-fetched; it never decides whether Hydra holds the client, so a
        request refused after the fetch cannot leave a later valid one without a
        registration.
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string }
          description: >-
            An `https://` URL is resolved as a Client ID Metadata Document
            (draft-ietf-oauth-client-id-metadata-document-02 §3: https, a path
            component, no userinfo, no query, no fragment, no dot segments,
            at most 255 characters). Anything else is passed through to Hydra.
        - name: redirect_uri
          in: query
          schema: { type: string }
          description: >-
            Must match one of the document's `redirect_uris` exactly, with the
            RFC 8252 §7.3 loopback exception (a registered `http://127.0.0.1/…`
            or `http://[::1]/…` entry matches any port; `localhost` does not).
        - name: scope
          in: query
          schema: { type: string }
          description: >-
            Space-delimited, and must stay within the scope the client's
            **document** registered, else `invalid_scope`. The registered scope
            is the document's own `scope` (RFC 7591 client metadata) filtered
            through `hydra.dcr.allowedScopes`, defaulting to `mcp` when the
            document declares none, plus `offline_access` — so a client that
            wants `agent` has to say so in its document. It is deliberately not
            derived from this parameter: otherwise whichever authorization
            arrived first would cap the client permanently.
        - name: state
          in: query
          schema: { type: string }
        - name: response_type
          in: query
          schema: { type: string, example: code }
        - name: code_challenge
          in: query
          schema: { type: string }
        - name: code_challenge_method
          in: query
          schema: { type: string, example: S256 }
      responses:
        "303":
          description: >-
            Hand-off. Normally to Hydra's `/oauth2/auth` with the query string
            intact. If CIMD resolution failed **after** the requested
            `redirect_uri` was validated against the document (an unsatisfiable
            `scope`, or a Hydra write failure), the redirect instead goes to
            that `redirect_uri` carrying `error`, `error_description` and the
            original `state` (RFC 6749 §4.1.2.1).
          headers:
            Location:
              schema: { type: string }
            Cache-Control:
              schema: { type: string, enum: [no-store] }
        "400":
          description: >-
            HTML error page. Used for every failure that happens **before** the
            requested `redirect_uri` could be validated against the document —
            an invalid Client Identifier URL, an unreachable, oversize,
            non-JSON, invalid or SSRF-blocked document, or a `redirect_uri` that
            is not registered. Such a `redirect_uri` is attacker-chosen, so the
            error is never redirected to it.
          content:
            text/html:
              schema: { type: string }

  /api/hydra/register:
    post:
      operationId: registerOauthClient
      tags: [discovery]
      security: []
      summary: Mediated Dynamic Client Registration (RFC 7591)
      description: >-
        Policy enforced locally (redirect-uri patterns, allowed scopes); the
        client is minted in Hydra as a public PKCE client. Rate-limited
        (10 / 15 min). `offline_access` is always added to the granted scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                redirect_uris: { type: array, items: { type: string } }
                scope: { type: string, description: "space-delimited; subset of allowed" }
                client_name: { type: string, default: "MCP Client" }
              required: [redirect_uris]
      responses:
        "201":
          description: Registered client
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id: { type: string }
                  client_id_issued_at: { type: integer }
                  token_endpoint_auth_method: { type: string, enum: [none] }
                  grant_types: { type: array, items: { type: string } }
                  response_types: { type: array, items: { type: string } }
                  redirect_uris: { type: array, items: { type: string } }
                  scope: { type: string }
                  client_name: { type: string }
        "400":
          description: "invalid_redirect_uri | invalid_scope"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  error_description: { type: string }
        "502":
          description: server_error — Hydra client creation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, enum: [server_error] }
                  error_description: { type: string }

  # ---------------------------------------------- hydra login/consent providers
  # These are unauthenticated (pre-token) provider flows. GET routes render HTML;
  # options/verify are JSON. Documented for completeness; full request/response
  # detail lives in src/hydra/routes.ts.
  /api/hydra/login/options:
    post:
      operationId: startHydraLogin
      tags: [hydra-provider]
      security: []
      summary: Passkey login challenge (rate-limited)
      responses:
        "200":
          description: "Assertion options + challengeId, or an error object when no passkeys exist."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnAuthenticationOptions" }
  /api/hydra/login/verify:
    post:
      operationId: finishHydraLogin
      tags: [hydra-provider]
      security: []
      summary: Verify login assertion, accept Hydra login request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                login_challenge: { type: string }
                challengeId: { type: string }
                credential: {}
      responses:
        "200":
          description: "{ redirectTo } on success; { error } on failure"
          content:
            application/json:
              schema:
                type: object
                properties: { redirectTo: { type: string }, error: { type: string } }
  /api/hydra/consent/options:
    post:
      operationId: startHydraConsent
      tags: [hydra-provider]
      security: []
      summary: Passkey consent challenge
      responses:
        "200": { description: "Assertion options + challengeId, or an error object." }
  /api/hydra/consent/verify:
    post:
      operationId: finishHydraConsent
      tags: [hydra-provider]
      security: []
      summary: Verify consent assertion, accept Hydra consent request
      responses:
        "200":
          description: "{ redirectTo }"
          content:
            application/json:
              schema: { type: object, properties: { redirectTo: { type: string } } }
  /api/hydra/consent/approve:
    post:
      operationId: approveHydraConsent
      tags: [hydra-provider]
      security: []
      summary: No-passkey consent grant (valid only after a fresh login in-flow)
      responses:
        "200":
          description: "{ redirectTo }; 400 { error: passkey_required } otherwise"
          content:
            application/json:
              schema: { type: object, properties: { redirectTo: { type: string } } }

  # -------------------------------------------------------------- account
  /api/auth/me:
    get:
      operationId: getCurrentAccount
      tags: [account]
      summary: Current account profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  isAdmin: { type: boolean }
                  showDemoEndpoints: { type: boolean }
                  demoEndpointsAvailable: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: updateCurrentAccount
      tags: [account]
      summary: Update current account (name, demo visibility)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                showDemoEndpoints: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusUpdated" }
        "400":
          description: Empty name or non-boolean flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/accounts:
    get:
      operationId: listAccounts
      tags: [account]
      summary: List all accounts (admin only)
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        isAdmin: { type: boolean }
                        enabled: { type: boolean }
                        maxSessions: { type: integer }
                        lastUsedAt: { type: string, format: date-time, nullable: true }
                        createdAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/{id}:
    delete:
      operationId: deleteAccount
      tags: [account]
      summary: Hard-delete an account + cascade (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDeleted" }
        "400":
          description: Cannot delete self or the admin account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/accounts/export-seed:
    get:
      operationId: exportSeedConfig
      tags: [account]
      summary: Export passkeys + endpoints as seed config (admin only)
      responses:
        "200":
          description: Seed
          content:
            application/json:
              schema:
                type: object
                properties:
                  passkeys:
                    type: array
                    items:
                      type: object
                      properties:
                        credentialId: { type: string }
                        publicKeyHex: { type: string }
                        counter: { type: integer }
                        transports: { type: array, items: { type: string } }
                        label: { type: string }
                  endpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        label: { type: string }
                        address: { type: string, description: "user@host:port" }
                        agentForward: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500":
          description: Database not available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # --------------------------------------------------------- auth-sessions
  /api/auth/sessions:
    get:
      operationId: listAuthorizedClients
      tags: [auth-sessions]
      summary: List authorized OAuth clients (one row per client_id)
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/AuthSessionView" }
  /api/auth/sessions/{clientId}:
    delete:
      operationId: revokeAuthorizedClient
      tags: [auth-sessions]
      summary: Revoke one client's grant (step-up gated)
      description: "Requires a step-up token for action `revoke_session`."
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [revoked] } }
        "401": { $ref: "#/components/responses/StepUpRequired" }
  /api/auth/sessions/revoke-all:
    post:
      operationId: revokeAllAuthorizedClients
      tags: [auth-sessions]
      summary: Sign out everywhere (step-up gated)
      description: "Requires a step-up token for action `revoke_all_sessions`."
      parameters:
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      responses:
        "200":
          description: Revoked all
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [revoked_all] } }
        "401": { $ref: "#/components/responses/StepUpRequired" }

  # ------------------------------------------------------------- endpoints
  /api/endpoints:
    get:
      operationId: listEndpoints
      tags: [endpoints]
      summary: List account endpoints (+ demo endpoints if enabled)
      responses:
        "200":
          description: Endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoints:
                    type: array
                    items: { $ref: "#/components/schemas/Endpoint" }
    post:
      operationId: createEndpoint
      tags: [endpoints]
      summary: Create endpoint (server generates the id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                host: { type: string }
                port: { type: integer, default: 22 }
                username: { type: string, default: shellwatch }
                userVerification: { type: string, enum: [required, preferred, discouraged] }
                agentForward: { type: boolean }
                description: { type: string, nullable: true }
              required: [label, host]
      responses:
        "200":
          description: Created (returns generated id)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusCreated" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/endpoints/{id}:
    put:
      operationId: updateEndpoint
      tags: [endpoints]
      summary: Update endpoint (demo ids rejected)
      description: >-
        Changing host or port clears the pinned host key (#241) and writes a
        host-key-cleared audit row — the next connection re-prompts the human
        for the new address's key.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                host: { type: string }
                port: { type: integer }
                username: { type: string }
                userVerification: { type: string, enum: [required, preferred, discouraged] }
                agentForward: { type: boolean }
                description: { type: string, nullable: true }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusUpdated" }
        "400":
          description: Validation error, or demo endpoint (read-only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteEndpoint
      tags: [endpoints]
      summary: Delete endpoint
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDeleted" }
        "400":
          description: Demo endpoint (read-only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            Endpoint has active sessions — opening or open sessions of any
            source (UI, MCP, one-time access guest), or a guest session still
            waiting for approval or allowed to ask again. Ended (closed or
            errored) sessions do not count. A successful delete revokes the
            endpoint's outstanding tickets.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/endpoints/{id}/host-key:
    put:
      operationId: pinEndpointHostKey
      tags: [endpoints]
      summary: Manually pin the endpoint's SSH host key (step-up gated, #241)
      description: >-
        Pins a host key before the first connection, from an OpenSSH public-key
        line (preferred — enables host-key-algorithm pinning) or a bare
        "SHA256:..." fingerprint (exactly one of the two). Compare-and-set: an
        existing pin is never overwritten — delete it first ("replace" =
        delete + pin). Recorded with pinnedBy "manual".
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey:
                  type: string
                  description: OpenSSH public-key line ("ssh-ed25519 AAAA... [comment]")
                fingerprint:
                  type: string
                  description: '"SHA256:..." fingerprint (fingerprint-only pin)'
      responses:
        "200":
          description: Pinned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusUpdated" }
        "400":
          description: Invalid body, unknown endpoint, or demo endpoint (read-only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "409":
          description: A host key is already pinned (delete it first)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteEndpointHostKey
      tags: [endpoints]
      summary: Forget the endpoint's pinned SSH host key (step-up gated, #241)
      description: >-
        The recovery path after a host-key mismatch: the next connection goes
        through the first-connection approval again. Writes a
        host-key-cleared audit row. Idempotent — deleting an absent pin is 200.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      responses:
        "200":
          description: Forgotten (or no pin existed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusDeleted" }
        "400":
          description: Unknown endpoint, or demo endpoint (read-only)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/StepUpRequired" }

  # --------------------------------------------------------------- tickets
  /api/endpoints/{id}/tickets:
    post:
      operationId: mintTicket
      tags: [tickets]
      summary: Mint a one-time access ticket for an endpoint
      description: >-
        Creates a single-use ticket granting one guest session on this
        endpoint, admitted only by the normal endpoint-auth approval on the
        owner's devices (#306). The `token` is returned exactly once, with
        `shareLink` = `<externalUrl>/t#<token>`: built from
        `server.externalUrl`, the only origin the guest routes accept, never
        from the address the owner happens to use (the token travels in the
        URL fragment and never reaches a server log). Every option defaults to the
        most restrictive value. At most 20 unredeemed tickets per account.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 100, default: "" }
                redeemTtlSeconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
                lifetimeSeconds: { type: integer, minimum: 60, maximum: 28800, default: 900 }
                reasonRequired: { type: boolean, default: true }
                agentForward: { type: boolean, default: false }
      responses:
        "201":
          description: "Minted. `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket: { $ref: "#/components/schemas/TicketView" }
                  token:
                    type: string
                    description: 32 random bytes, base64url. Stored only as a hash.
                  shareLink:
                    type: string
                    description: The link to hand the guest — `<externalUrl>/t#<token>`.
                required: [ticket, token, shareLink]
        "400":
          description: An option of the wrong type or outside its bounds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Endpoint not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The account already has 20 unredeemed tickets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: List the account's tickets and guest sessions (live and recently closed)
      parameters:
        - name: endpointId
          in: query
          description: Only tickets for this endpoint.
          schema: { type: string }
      responses:
        "200":
          description: Tickets, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  tickets:
                    type: array
                    items: { $ref: "#/components/schemas/TicketView" }
                required: [tickets]
  /api/tickets/{id}:
    delete:
      operationId: revokeTicket
      tags: [tickets]
      summary: Revoke a ticket in any state
      description: >-
        An unredeemed ticket is deleted. A redeemed one ends its guest session
        through the one close path (reason `ticket-revoked`): the terminal
        session is closed or its setup cancelled, open sign prompts are
        cancelled, the guest cookie stops working and the guest's WebSocket
        receives the final `closed` status. A ticket whose guest session
        already ended (`closed`) answers 409 and stays listed until it
        expires (5 minutes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [revoked] } }
                required: [status]
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The ticket's guest session already ended; nothing changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/tickets/check:
    post:
      operationId: checkTicket
      tags: [tickets]
      summary: Check a ticket without redeeming it (guest)
      security: []
      description: >-
        Lets the guest page show an invalid link at once, before asking for a
        reason (#306). It applies exactly redeem's checks (unknown, used,
        revoked or expired ticket, or one whose endpoint or account is gone)
        and consumes nothing; an expired or ineligible ticket is spent here
        just as redeem would spend it. No bearer token, no cookie. Same
        `security.allowedNetworks` gate (403), `Origin` check (403
        `Forbidden`) as redeem, and a per-IP rate limit of its own (60 per
        15 minutes; redeem's is 20). Every response carries
        `Cache-Control: no-store`. Nothing in
        any response names the endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        "200":
          description: The ticket can be redeemed now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reasonRequired:
                    type: boolean
                    description: Whether redeem will require a non-empty reason.
                required: [reasonRequired]
        "403":
          description: Origin is not the configured external origin, or the peer is outside allowedNetworks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Uniform failure, exactly as for redeemTicket. The real reason is only logged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: The per-IP rate limit (60 per 15 minutes, separate from redeemTicket's).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: The account or endpoint could not be checked; try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/tickets/redeem:
    post:
      operationId: redeemTicket
      tags: [tickets]
      summary: Redeem a ticket (guest)
      security: []
      description: >-
        The guest page's call that spends the ticket (#306); `checkTicket`
        may precede it. No bearer token: the ticket in
        the body is the credential, and the route behaves identically with no,
        a valid or an invalid `Authorization` header. It sits behind
        `security.allowedNetworks` (403) and a per-IP rate limit (429 with the
        rate-limit body), and refuses any `Origin` other than
        `server.externalUrl`'s origin (403 `Forbidden`) — it sets a cookie, so
        a foreign page must not be able to call it.


        Redemption consumes the ticket and answers at once: nothing is
        connected and no prompt is raised until the guest's `/ws/guest`
        connection attaches (docs/api/websocket-protocol.md). The response
        sets the guest cookie `__Host-sw_guest` (`Secure; HttpOnly;
        SameSite=Strict; Path=/`), valid only on `/ws/guest`. Every response
        carries `Cache-Control: no-store`. Nothing in any response names the
        endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                reason:
                  type: string
                  description: >-
                    Why the guest wants access. Control characters are stripped
                    and it is capped at 200 characters. Required (non-empty) when the
                    ticket says so.
                replaceCurrent:
                  type: boolean
                  default: false
                  description: >-
                    End this browser's current guest session (named by its
                    guest cookie) in the same step that consumes the ticket,
                    instead of answering 409. The old session is not attached
                    for it, so it raises no owner prompt.
              required: [token]
      responses:
        "202":
          description: Redeemed; the guest cookie is set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmationCode:
                    type: string
                    description: 4 characters from an alphabet without look-alikes.
                  attachDeadline:
                    type: string
                    format: date-time
                    description: The guest WebSocket must attach by then (30 s).
                  admissionWindowSeconds:
                    type: integer
                    description: How long, from the first attach, the guest may wait to be admitted.
                  lifetimeSeconds: { type: integer }
                  agentForward: { type: boolean }
                required:
                  [
                    confirmationCode,
                    attachDeadline,
                    admissionWindowSeconds,
                    lifetimeSeconds,
                    agentForward,
                  ]
        "400":
          description: The ticket requires a reason and none was given (not consumed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Origin is not the configured external origin, or the peer is outside allowedNetworks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            Uniform failure: unknown, used, expired or revoked ticket, or one
            whose endpoint or account is gone or disabled. The real reason is
            only logged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            This browser already holds a live guest session and
            `replaceCurrent` is not set (the ticket is not consumed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            The account is at its cap of 3 live guest sessions (`Retry-After`
            set; the ticket is not consumed), or the per-IP rate limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: >-
            The account or endpoint could not be checked (a database error or
            an aborted request). The ticket is not consumed; try again.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------------------- sessions
  /api/sessions:
    get:
      operationId: listSessions
      tags: [sessions]
      summary: List the account's terminal sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/TerminalSession" }
    post:
      operationId: createSession
      tags: [sessions]
      summary: Open an SSH session to an endpoint
      description: >-
        NOTE the asymmetric envelope — this returns the bare TerminalSession
        object, unlike POST /api/endpoints which returns `{ status, id }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { endpointId: { type: string } }
              required: [endpointId]
      responses:
        "200":
          description: Session (bare object)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalSession" }
        "404":
          description: Endpoint not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Per-account concurrent session limit reached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "400":
          description: >-
            Connect failed. `error` is the connect error chain. A connection
            refused because the endpoint accepted SSH "none" authentication
            (#311) reads "SSH connection to <host:port> refused: the endpoint
            accepted the connection without authentication; ShellWatch
            refuses such connections" — never the "All configured
            authentication methods failed" wording, and not an approval
            outcome. Failures that were published to the notification log
            (host-key-mismatch, unauthenticated-endpoint,
            session-connect-failed) carry `notificationId`, present only when
            the notification was actually persisted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/sessions/{sessionId}/tail:
    get:
      operationId: getSessionTail
      tags: [sessions]
      summary: Read the tail of a session's output buffer
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 2000, maximum: 8000 }
      responses:
        "200":
          description: Output tail
          content:
            application/json:
              schema:
                type: object
                properties: { data: { type: string } }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/sessions/{sessionId}:
    delete:
      operationId: closeSession
      tags: [sessions]
      summary: Close a session
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [closed] } }
        "404": { $ref: "#/components/responses/NotFound" }

  # --------------------------------------------------------------- actions
  /api/actions/{actionId}:
    get:
      operationId: getAction
      tags: [actions]
      summary: Get a pending signing action
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Action view
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingActionView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/actions/{actionId}/resolve:
    post:
      operationId: resolveAction
      tags: [actions]
      summary: Resolve a signing action (WebAuthn signature or key-approve)
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        description: Required for `webauthn-sign`; omit for `key-approve`.
        content:
          application/json:
            schema:
              type: object
              properties:
                authenticatorData: { type: string, description: base64url }
                signature: { type: string, description: base64url }
                clientDataJSON: { type: string, description: base64url }
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                type: object
                properties: { redirectTo: { type: string, nullable: true } }
        "400":
          description: Missing fields, or UV required but not set
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Action not pending / could not be resolved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/actions/{actionId}/deny:
    post:
      operationId: denyAction
      tags: [actions]
      summary: Deny a signing action
      parameters:
        - { name: actionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: >-
            Denied. Idempotent over every no-signature outcome: denying an
            action that is already denied or already expired also answers
            200 — what the caller asked for (no signature) holds either way.
            `status` is the state the store asserted ("expired" when the
            action lapsed before the deny landed).
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [denied, expired] } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Action already completed — the message names the state the action
            actually ended in, never a guessed one.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ----------------------------------------------------------------- audit
  /api/audit/sessions:
    get:
      operationId: listAuditSessions
      tags: [audit]
      summary: Query session-lifecycle events
      parameters:
        - { name: endpointId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side (clampLimit): non-finite or ≤0 → 50;
            values above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionLifecyclePage" }
  /api/audit/signings:
    get:
      operationId: listAuditSignings
      tags: [audit]
      summary: Query signing-request audit
      parameters:
        - {
            name: source,
            in: query,
            schema:
              {
                type: string,
                enum: [endpoint-auth, agent-forwarding, agent-proxy, endpoint-admin],
              },
          }
        - {
            name: outcome,
            in: query,
            schema: { type: string, enum: [approved, denied, expired, cancelled] },
          }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side (clampLimit): non-finite or ≤0 → 50;
            values above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningRequestPage" }
        "400":
          description: Invalid source/outcome filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/audit/signings/{id}:
    get:
      operationId: getAuditSigning
      tags: [audit]
      summary: Get one signing-request record
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Row
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SigningRequestRow" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/audit/notifications:
    get:
      operationId: listAuditNotifications
      tags: [audit]
      summary: Account notification log
      description: >-
        The third audit surface (#252): append-only, keyset-paginated, newest
        first. Live delivery happens over the WebSocket (notification:new);
        this log is what a reconnecting client reads to catch up on what a
        closed tab missed.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side: non-finite or ≤0 → 50; values
            above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of notifications
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }

  /api/audit/oauth-clients:
    get:
      operationId: listAuditOAuthClients
      tags: [audit]
      summary: OAuth client registration log (admin only)
      description: >-
        The fourth audit surface (#242): append-only, keyset-paginated, newest
        first. Records every DCR registration and every CIMD document
        resolution, including rejections.


        **Admin only, and not account-scoped.** Every other audit route filters
        on the caller's account; these rows are pre-account by nature (DCR and
        CIMD both run before a subject exists), so the admin role is the only
        thing in front of them. A non-admin caller gets 403.


        Runtime allow/deny policy over these clients is tracked separately in
        #255.
      parameters:
        - name: clientId
          in: query
          description: Exact Hydra `client_id` — the full history of one client.
          schema: { type: string }
        - name: origin
          in: query
          description: "`dcr` or `cimd`; any other value is a 400."
          schema: { type: string, enum: [dcr, cimd] }
        - name: event
          in: query
          description: "`registered`, `refreshed` or `rejected`; any other value is a 400."
          schema: { type: string }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side: non-finite or ≤0 → 50; values
            above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of registration events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OAuthClientRegistrationPage" }
        "400":
          description: Invalid origin or event filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller does not hold the admin role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/audit/file-transfers:
    get:
      operationId: listAuditFileTransfers
      tags: [audit]
      summary: File-transfer log
      description: >-
        The fifth audit surface (#263): every file operation an MCP agent
        performed through one of the account's sessions — inline
        list/read/write and out-of-band link transfers — keyset-paginated,
        newest first, account-scoped. Live delivery to attached browsers
        happens over the WebSocket (terminal:file).
      parameters:
        - name: sessionId
          in: query
          description: Only operations of this session.
          schema: { type: string }
        - name: direction
          in: query
          description: "`upload`, `download` or `list`; any other value is a 400."
          schema: { type: string, enum: [upload, download, list] }
        - name: tier
          in: query
          description: "`inline` or `link`; any other value is a 400."
          schema: { type: string, enum: [inline, link] }
        - name: status
          in: query
          description: A FileTransferRow status; any other value is a 400.
          schema:
            type: string
            enum: [pending, active, committing, completed, failed, cancelled, expired]
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side: non-finite or ≤0 → 50; values
            above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of file-transfer rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileTransferPage" }
        "400":
          description: Invalid direction, tier or status filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/audit/tickets:
    get:
      operationId: listAuditTickets
      tags: [audit]
      summary: Ticket event log
      description: >-
        The sixth audit surface (#306): every event of the account's one-time
        access tickets and guest sessions, keyset-paginated, newest first.
      parameters:
        - name: ticketId
          in: query
          description: Only events of this ticket.
          schema: { type: string }
        - name: event
          in: query
          description: A TicketEventRow event; any other value is a 400.
          schema: { type: string }
        - { name: cursor, in: query, schema: { type: string } }
        - name: limit
          in: query
          description: >-
            Page size. Clamped server-side: non-finite or ≤0 → 50; values
            above 500 → 500. Default 50, max 500.
          schema: { type: integer, default: 50, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Page of ticket events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketEventPage" }
        "400":
          description: Invalid event filter
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------- transfers
  /api/transfers/{token}:
    put:
      operationId: uploadTransfer
      tags: [transfers]
      summary: Upload a file through a transfer link
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: >-
            The opaque single-use transfer token from the
            `shellwatch_transfer_file` `create` result. It is the **only**
            credential on this route and is redacted from the access log
            (`/api/transfers/***`).
          schema: { type: string }
      description: >-
        Streams the raw request body to the remote path the link is bound to,
        over the SFTP subsystem of the bound session (#263). No bearer token:
        the token in the path is the credential, because the sandbox running
        `curl` has none. The route sits behind `security.allowedNetworks` (403
        `Forbidden`, same as `/mcp`).


        The link is **single use** and must be claimed within
        `transfer.linkTtlSeconds`. An unknown, used, expired or
        session-invalidated token — and a link minted for a download — all
        answer the same 404. When active capacity is exhausted the answer is
        503 with `Retry-After` and the link stays usable.


        The body is staged in a private directory next to the destination and
        committed atomically (hardlink for no-clobber, posix-rename for
        replace); see docs/api/mcp-tools.md for the commit, cleanup and
        cancellation semantics. Every response carries `Cache-Control: no-store`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Committed. `status` is `completed`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "403":
          description: Peer address outside `security.allowedNetworks`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown, used, expired or invalidated link (uniform)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            Refused or aborted: destination exists / is a symlink or special
            file, the commit was rejected (`commitOutcome: failed`), or the
            transfer was cancelled, timed out, or lost its session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "413":
          description: Body exceeds the link's byte cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "422":
          description: sha256 of the body does not match the expected digest
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "502":
          description: >-
            Remote SFTP failure, including a connection lost during the commit
            (`commitOutcome: unknown`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "503":
          description: >-
            Too many active transfers (`transfer.maxActivePerAccount` /
            `transfer.maxActiveGlobal`). Carries `Retry-After`; the link stays
            pending and can be retried within its TTL.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: downloadTransfer
      tags: [transfers]
      summary: Download a file through a transfer link
      security: []
      parameters:
        - name: token
          in: path
          required: true
          description: The opaque single-use transfer token (see the upload).
          schema: { type: string }
      description: >-
        Streams the remote file the link is bound to. Gating, single-use, TTL,
        the uniform 404 and the 503 capacity answer are as for the upload.


        The file is opened first and `Content-Length` is its size at that
        moment. If the file shrinks while it is read, the response **ends short
        of `Content-Length`** (the client sees a truncated transfer) and the
        transfer is `failed`. Once the body has started, a failure can only be
        signalled that way — ask `shellwatch_transfer_file` `status` for the
        outcome. A completed response means the server finished sending; it
        cannot attest that the client saved the file.
      responses:
        "200":
          description: The file's bytes
          headers:
            Content-Length:
              schema: { type: integer }
              description: Size of the file when it was opened.
            X-Transfer-Id:
              schema: { type: string }
              description: The transfer's id.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "403":
          description: Peer address outside `security.allowedNetworks`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown, used, expired or invalidated link (uniform)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The remote path cannot be opened or is not a regular file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "413":
          description: The file is larger than the link's byte cap
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "502":
          description: Remote SFTP failure before the body started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferResult" }
        "503":
          description: Too many active transfers; carries `Retry-After`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ------------------------------------------------------------------ keys
  /api/keys:
    get:
      operationId: listSshKeys
      tags: [keys]
      summary: List file-based SSH keys (admin sees keys; non-admin sees empty)
      responses:
        "200":
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }
                        type: { type: string }
                        algorithm: { type: string }
                        fingerprint: { type: string }
                        revoked: { type: boolean }
                        available: { type: boolean }
                        authorizedKeysEntry: { type: string, nullable: true }
                        createdAt: { type: string, format: date-time }
                        lastUsedAt: { type: string, format: date-time, nullable: true }

  # ------------------------------------------------------------------ push
  /api/push/subscribe:
    post:
      operationId: createPushSubscription
      tags: [push]
      summary: Register a Web Push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                endpoint: { type: string }
                keys:
                  type: object
                  properties:
                    p256dh: { type: string }
                    auth: { type: string }
                  required: [p256dh, auth]
              required: [endpoint, keys]
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                properties: { id: { type: string } }
        "400":
          description: Invalid subscription or unrecognized push service
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Endpoint already registered to a different account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deletePushSubscription
      tags: [push]
      summary: Unregister a Web Push subscription
      description: "NOTE the envelope — success is `{ ok: true }`, not `{ status }`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { endpoint: { type: string } }
              required: [endpoint]
      responses:
        "200":
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, enum: [true] } }
        "400":
          description: endpoint required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------------------- webauthn
  /api/webauthn/register/options:
    post:
      operationId: startPasskeyRegistration
      tags: [webauthn]
      summary: Registration options for an in-account passkey add
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { label: { type: string }, name: { type: string } }
              required: [label]
      responses:
        "200":
          description: Registration options + challengeId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnRegistrationOptions" }
  /api/webauthn/register:
    post:
      operationId: finishPasskeyRegistration
      tags: [webauthn]
      summary: Verify + store a new passkey (step-up gated — register_passkey)
      parameters:
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { challengeId: { type: string }, credential: {} }
              required: [challengeId, credential]
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean, enum: [true] }
                  credentialId: { type: string }
                  id: { type: string }
                  label: { type: string }
                  authorizedKeysEntry: { type: string, nullable: true }
                  sshdConfig: { type: string, nullable: true }
        "400":
          description: Verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
  /api/webauthn/credentials:
    get:
      operationId: listPasskeys
      tags: [webauthn]
      summary: List the account's passkeys
      description: >-
        Active passkeys come first, in priority order (the order every SSH
        signing path offers them, #308); pending and revoked credentials
        follow with a null priority.
      responses:
        "200":
          description: Credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyList" }
  /api/webauthn/credentials/order:
    put:
      operationId: reorderPasskeys
      tags: [webauthn]
      summary: Set the passkey priority order
      description: >-
        Rewrites the priorities of the account's active passkeys to 0..n-1 in
        the given order (first = tried first for SSH signing). `ids` are
        credential row ids (`id` in the list response), not WebAuthn
        `credentialId`s, and must be exactly the account's active,
        non-revoked credentials: a missing, extra, duplicate or foreign id is
        rejected with 400 and nothing changes. Validation and rewrite run in
        one transaction. A new order applies to new connections; open
        sessions and agent connections keep the order they started with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
              required: [ids]
      responses:
        "200":
          description: The updated list, same shape as listPasskeys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyList" }
        "400":
          description: Malformed body, or ids are not exactly the active passkeys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/webauthn/credentials/{id}/label:
    patch:
      operationId: updatePasskeyLabel
      tags: [webauthn]
      summary: Rename a passkey (no step-up — cosmetic)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { label: { type: string } }
              required: [label]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusUpdated" }
        "400":
          description: Label required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Duplicate label
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/webauthn/credentials/{id}/revoke:
    post:
      operationId: revokePasskey
      tags: [webauthn]
      summary: Revoke a passkey (step-up gated — revoke_passkey)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { invalidateSessions: { type: boolean } }
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [revoked] }
                  sessionsInvalidated: { type: boolean }
        "400":
          description: Already revoked, or the last active passkey (can't revoke)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "404":
          description: Credential not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/webauthn/credentials/{id}/confirm:
    post:
      operationId: confirmPasskey
      tags: [webauthn]
      summary: Confirm a pending invite passkey (step-up gated — confirm_passkey)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/StepUpTokenHeader" }
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, enum: [active] } }
        "400":
          description: Revoked / already active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/StepUpRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/webauthn/invite:
    get:
      operationId: getPasskeyInvite
      tags: [webauthn]
      summary: Get the active passkey invite (if any)
      responses:
        "200":
          description: Invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      token: { type: string }
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
        "404":
          description: No active invite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createPasskeyInvite
      tags: [webauthn]
      summary: Mint a passkey invite
      responses:
        "200":
          description: Invite
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite:
                    type: object
                    properties:
                      token: { type: string }
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time }
  /api/webauthn/stepup/options:
    post:
      operationId: startStepUp
      tags: [webauthn]
      summary: Authentication options for a step-up ceremony
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  # Wire values are snake_case (STEPUP_ACTION map values), not the
                  # camelCase keys — verified by the fake-authenticator ceremony test.
                  enum:
                    [
                      register_passkey,
                      revoke_passkey,
                      confirm_passkey,
                      revoke_session,
                      revoke_all_sessions,
                      reset_host_key,
                      pin_host_key,
                    ]
              required: [action]
      responses:
        "200":
          description: Auth options + challengeId + action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnAuthenticationOptions" }
        "400":
          description: Invalid/missing action, or no active credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/webauthn/stepup/verify:
    post:
      operationId: finishStepUp
      tags: [webauthn]
      summary: Verify a step-up assertion, mint a single-use step-up token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeId: { type: string }
                credential: {}
                action:
                  type: string
                  # Wire values are snake_case (STEPUP_ACTION map values), not the
                  # camelCase keys — verified by the fake-authenticator ceremony test.
                  enum:
                    [
                      register_passkey,
                      revoke_passkey,
                      confirm_passkey,
                      revoke_session,
                      revoke_all_sessions,
                      reset_host_key,
                      pin_host_key,
                    ]
              required: [challengeId, credential, action]
      responses:
        "200":
          description: Step-up token
          content:
            application/json:
              schema:
                type: object
                properties:
                  stepUpToken: { type: string }
                  expiresAt: { type: string, format: date-time }
                  action: { type: string }
        "400":
          description: Invalid action / expired challenge / unknown credential / verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------- passkey-invite (anon)
  /api/passkey-invite/{token}:
    get:
      operationId: getPasskeyInviteByToken
      tags: [passkey-invite]
      security: []
      summary: Look up an invite by token (anonymous)
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Invite meta
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountName: { type: string, nullable: true }
                  expiresAt: { type: string, format: date-time }
        "404":
          description: Invite not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/passkey-invite/register/options:
    post:
      operationId: startInvitePasskeyRegistration
      tags: [passkey-invite]
      security: []
      summary: Registration options for invite enrollment (anonymous)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { token: { type: string } }
              required: [token]
      responses:
        "200":
          description: Registration options + challengeId
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebAuthnRegistrationOptions" }
        "400":
          description: Token required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invite not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/passkey-invite/register:
    post:
      operationId: finishInvitePasskeyRegistration
      tags: [passkey-invite]
      security: []
      summary: Verify + enroll a passkey via invite (anonymous)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                challengeId: { type: string }
                credential: {}
              required: [token, challengeId, credential]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [registered] }
                  label: { type: string }
                  fingerprint: { type: string }
        "400":
          description: Token required / verification failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Invite not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Invite already used
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
