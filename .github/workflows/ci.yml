name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  spdx:
    name: SPDX Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node scripts/spdx-headers.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fail on any advisory of moderate severity or higher. Patched transitives
      # are pinned via `overrides` in pnpm-workspace.yaml.
      - run: pnpm audit --audit-level moderate

  svelte-check:
    name: Svelte Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:svelte

  unit-tests:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  integration-tests:
    name: Integration Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  # Black-box end-to-end suite (#244): the built server (dist/) launched as a
  # child process against a real OpenSSH sshd + a real Ory Hydra in compose,
  # driven only over the wire (REST, WS, MCP, agent-proxy via the Go agent).
  # One leg per sshd image; the modern leg also runs the webauthn-sk scenarios.
  # See docs/testing.md.
  e2e:
    name: E2E (Node ${{ matrix.node-version }} / sshd ${{ matrix.sshd }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
        sshd: [modern, stable]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent-client/go.mod
          cache-dependency-path: agent-client/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build agent-client
        working-directory: agent-client
        run: go build -o shellwatch-agent ./cmd/shellwatch-agent
      - name: Start sshd + Hydra
        run: pnpm e2e:up
      - name: Run e2e suite
        env:
          E2E_SSHD: ${{ matrix.sshd }}
          E2E_SKIP_BUILD: "1"
        run: pnpm test:e2e
      - name: Collect compose logs
        if: failure()
        run: pnpm test:e2e:logs > e2e/out/compose-all.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.sshd }}-node${{ matrix.node-version }}
          path: e2e/out/**
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: pnpm e2e:down

  # Spec-lint gate for the wire contract: #225 promises the OpenAPI spec is
  # "validated in CI" — this job is that validation (same command as the
  # local `pnpm api:lint`).
  api-lint:
    name: API Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  # Go-codegen gate for the wire contract (#232, ahead of the #210 rewrite):
  # the OpenAPI spec must stay consumable by the pinned oapi-codegen and the
  # generated REST surface must compile. Full build/vet/test jobs for the
  # root Go module arrive with Phase 1.
  api-codegen:
    name: API Codegen (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: bash scripts/check-api-codegen.sh

  # Agent build matrix — catches windows/unix build-tag breakage at PR time
  # rather than at release-cut. Build only; tests run once on linux below.
  agent-build:
    name: Agent Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent-client/go.mod
          cache-dependency-path: agent-client/go.sum
      - name: Build
        working-directory: agent-client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  agent-test:
    name: Agent Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent-client/go.mod
          cache-dependency-path: agent-client/go.sum
      - name: Test
        working-directory: agent-client
        run: go test ./...
